[project]
name = "pantograph"
version = "0.1.0"
description = "Relay event registration and photo collection platform"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-login",
    "flask-limiter",
    "authlib",
    "requests",
    "gunicorn",
    "haversine",
    "pillow",
    "pillow-heif",
    "passlib[argon2]",
    "boto3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
